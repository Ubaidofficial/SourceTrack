name: CI Regression Pipeline

on:
  push:
    branches: [ main ]
  # `feat/home-v14` is the homepage-rebuild integration branch: phases 2a/2b/2c each
  # open their own PR against it and only the finished result goes to main as one
  # cutover. Without it listed here a phase PR matches no trigger, reports "no checks
  # reported", and the CI-green-on-the-exact-head-SHA merge gate (CLAUDE.md §9) is
  # silently suspended for the whole series — which is exactly what happened to #646.
  #
  # NOTE for the next integration branch: adding the name here is necessary but may not
  # be sufficient. For `pull_request` events GitHub reads the workflow file from the BASE
  # branch, so a PR into an integration branch that predates this change can still report
  # no checks until this commit is merged INTO that branch too.
  pull_request:
    branches: [ main, feat/home-v14 ]
  # Manual trigger. Added 2026-08-07 after getting a verdict on `main` required pushing an
  # EMPTY COMMIT (3e495e6b) purely to move the head — the only way to make `push` fire.
  # That is a bad tool for the job: it rewrites main's history for a diagnostic, and under
  # `cancel-in-progress` a second push can cancel the run you were waiting for.
  #
  # Particularly needed on `main`, where runs are scarce for a structural reason: rapid
  # sequential squash-merges cancel each other (see `concurrency` below), so a batch can
  # leave main untested with no way to ask for a verdict after the fact. This gives one.
  workflow_dispatch:

# Cancel a superseded in-flight run when a branch is pushed again, so a rapid
# push sequence bills one full run instead of N. Keyed by ref, so a PR branch and
# a push to main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Safe placeholder variables for frontend build context
      VITE_SUPABASE_URL: "https://placeholder.supabase.co"
      VITE_SUPABASE_ANON_KEY: "placeholder"
      VITE_API_URL: "https://api.placeholder.com"
      VITE_TRACKER_BASE_URL: "https://api.placeholder.com"
      VITE_FRONTEND_URL: "https://app.placeholder.com"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: |
          cd dashboard
          npm ci

      - name: Verify file syntax
        run: |
          node --check api/index.js api/routes/*.js api/lib/*.js scripts/*.js
          node --check scripts/*.mjs

      - name: Git whitespace check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check origin/${{ github.base_ref }}...HEAD
          else
            git diff --check HEAD~1..HEAD
          fi

      # FEATURE_MAP freshness guard — the check FEATURE_MAP.md's own header recommends.
      #
      # ⚠️ ADVISORY BY DEFAULT (FEATURE_MAP_GUARD unset => warn, exit 0). Two reasons, both
      # measured rather than assumed:
      #   1. It cannot BLOCK until CLAUDE.md §9 rule 3 carries the FEATURE_MAP.md carve-out.
      #      Rule 3 requires an empty session-doc (*.md) diff; FEATURE_MAP.md is *.md. With
      #      the guard blocking and rule 3 unamended, every feature PR is unmergeable —
      #      update the map and fail rule 3, or skip it and fail this. That is a direct
      #      contradiction, not a race.
      #   2. Measured on the last 30 merged PRs (#661-#691): it fires on 5, and only ONE
      #      (#676) was a capability change the map should record. A blocking check that is
      #      wrong four times in five gets bypassed as routine, which converts a known gap
      #      into a false sense of coverage — strictly worse than no check.
      # Flip to blocking by setting FEATURE_MAP_GUARD=block here, AFTER the carve-out lands
      # and the path list has been re-scoped against real opt-out counts.
      - name: FEATURE_MAP freshness guard (advisory)
        if: github.event_name == 'pull_request'
        env:
          GUARD_BASE: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/feature-map-guard.mjs

      - name: Static launch QA
        run: npm run qa:static

      - name: Identity and billing unit tests
        run: npm run qa:identity:unit

      - name: Tracker unit tests
        run: npm run qa:tracker:unit

      - name: Attribution unit tests
        run: npm run qa:attribution:unit

      - name: Tinybird dual-write unit tests
        run: npm run qa:tinybird:unit

      - name: Lint dashboard (no-undef gate)
        # REQUIRED (no continue-on-error): `no-undef` is error-level, so a variable/component
        # referenced but not in scope — the `formattedRevenue is not defined` white-screen class —
        # fails the build BEFORE it can ship. `npm run build` passes on that bug; this does not.
        # Everything else in eslint.config.js is warn-only, so `eslint src` exits 0 on warnings.
        run: |
          cd dashboard
          npm run lint

      - name: Build dashboard production target
        run: |
          cd dashboard
          npm run build

      # Detection existed; nothing surfaced it. #335 sat RED on main for ~5h and every
      # open PR inherited the failure (pull_request CI runs on the merge commit). Branch
      # protection is unavailable on Free/private, so this alerts instead of blocking.
      - name: Alert on red main
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::SLACK_WEBHOOK_URL secret is unset — red main would go unannounced"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"main is RED — build-and-test failed on ${GITHUB_SHA:0:7}. Every open PR will inherit this until it is fixed. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL")
          echo "slack http $code"
          [ "$code" = "200" ] || { echo "::error::alert POST returned $code"; exit 1; }

  # marketing/ is a SEPARATE npm project (its own package.json + lockfile, Astro/Vite —
  # not the root workspace and not dashboard/). Until this job existed, nothing in CI
  # installed it or compiled a single .astro file: a green pipeline said only that the
  # API and dashboard were unaffected, never that the marketing site still built. PRs
  # #476-#482 all landed on that basis.
  #
  # A separate job rather than more steps on build-and-test: it needs none of that job's
  # root/dashboard installs or VITE_* env, and a failure here should read as "marketing
  # broke", not as a mystery step 12 in an API run. It also runs in parallel, so it adds
  # no wall-clock to the critical path.
  marketing-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 22, NOT the 20 that build-and-test uses — do not "unify" these. Astro 6.2.1
      # hard-refuses to build on anything below 22.12.0 ("Node.js v20.20.2 is not
      # supported by Astro!", exit 1, before it compiles a single page). This job was
      # first written with 20 to match the job above and failed on exactly that; the
      # error is invisible to anyone whose local Node is already 22+.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install marketing dependencies
        run: |
          cd marketing
          npm ci

      - name: Build marketing site
        run: |
          cd marketing
          npm run build

      # The 271 pre-existing errors this gate used to be blocked on are FIXED (267 of them
      # `className` on plain elements across 30 .astro files). `astro check` now reports
      # 0 errors / 0 warnings, so the gate the previous comment here asked for as a
      # fast-follow is now live. It catches the class of bug at the SOURCE.
      - name: Type-check marketing site
        run: |
          cd marketing
          npx astro check

      # ...and this catches it in the OUTPUT, which is the only surface that proves what
      # actually shipped. Both are kept because they fail at different moments and neither
      # subsumes the other: `astro check` sees a .astro file the build might tree-shake,
      # while this sees the rendered HTML including anything a component injected.
      #
      # This is not a hypothetical gate. 267 elements across 30 of 50 pages reached
      # production rendering with NO class attribute at all — `className` is not an error
      # in Astro, it is emitted verbatim and silently ignored by the DOM — and nothing in
      # the pipeline looked at the built output, so it stayed invisible.
      - name: Check built marketing HTML
        run: node scripts/qa-marketing-html.mjs marketing/dist

      # A third gate on the same output, asking a different question: is the content actually
      # VISIBLE? qa-marketing-html.mjs checks that markup is well-formed and styled; it has
      # nothing to say about a perfectly-formed element that ships style="opacity:0" and waits
      # for a scroll animation that may never run. Three sections shipped exactly that — with
      # JS disabled the homepage painted the WhyChooseUs dividers with no feature cards, and the
      # pricing section as bare background with no plan names, prices, features or CTAs.
      - name: Check marketing content survives without JS
        run: node scripts/qa-marketing-no-js-content.mjs marketing/dist

      # The mirror image of the check above, and NOT redundant with it. That one reads built HTML
      # and asks "did the server ship this hidden?". This reads source and asks "can the client
      # strand it hidden?" — a reveal that hides from JS and waits on an IntersectionObserver has
      # no way back if the observer never fires. CallToAction, Footer and Social failed exactly
      # that way with working JS while their built HTML was completely clean, so no output scan
      # could ever have caught it.
      - name: Check marketing reveals cannot strand content hidden
        run: node scripts/qa-marketing-reveal-safety.mjs marketing/src

      # Same reasoning as build-and-test above: without this, a marketing build that
      # breaks on main is invisible until someone happens to look at the Actions tab.
      - name: Alert on red main
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::SLACK_WEBHOOK_URL secret is unset — red main would go unannounced"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"main is RED — marketing-build failed on ${GITHUB_SHA:0:7}. The marketing site does not compile. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL")
          echo "slack http $code"
          [ "$code" = "200" ] || { echo "::error::alert POST returned $code"; exit 1; }
