<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SourceTrack — Revenue Attribution Analytics for SaaS, Lead Gen, and Agencies</title>
    <meta name="description" content="SourceTrack helps SaaS, lead-gen, and agency teams track which sources, campaigns, AI referrals, and customer journeys turn into conversions and revenue. Multi-touch attribution with a lightweight install." />
    <meta name="robots" content="index, follow" />
    <!-- Canonical is injected per-page at runtime via react-helmet-async (every
         indexable route sets its own). No static root canonical here — a hardcoded
         https://www.sourcetrack.ai/ would wrongly canonicalize every page to the homepage. -->

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.sourcetrack.ai/" />
    <meta property="og:title"       content="SourceTrack — Know which sources actually create revenue" />
    <meta property="og:description" content="Track campaigns, AI referrals, customer journeys, and conversions. See which sources produce leads, trials, and revenue — not just clicks. Multi-touch attribution for SaaS, lead-gen, and agencies." />
    <meta property="og:image"       content="https://www.sourcetrack.ai/og-image.png" />
    <meta property="og:site_name"   content="SourceTrack" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@sourcetrackio" />
    <meta name="twitter:title"       content="SourceTrack — Revenue Attribution Analytics" />
    <meta name="twitter:description" content="Track campaigns, AI referrals, and customer journeys. See which sources produce conversions and revenue — not just traffic. Multi-touch attribution for modern teams." />
    <meta name="twitter:image"       content="https://www.sourcetrack.ai/og-image.png" />

    <!-- Favicon / App Icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#D2EC2A" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
